        try {

          const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/ogg";
          mimeTypeRef.current = mimeType;
          const mr = new MediaRecorder(stream, { mimeType });
          mediaRecorderRef.current = mr;
          chunksRef.current = [];
          mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
          mr.start(100);
          setEscuchando(true);
          timerRef.current = setTimeout(() => pararGrabacion(), 15000);

          setGrabacionTexto("No se pudo acceder al micrófono. Permite el acceso e inténtalo de nuevo.");
        }
      }

      function pararGrabacion() {
        clearTimeout(timerRef.current);
        const mr = mediaRecorderRef.current;
        if (!mr || mr.state === "inactive") return;
        mr.onstop = async () => {
          streamRef.current?.getTracks().forEach(t => t.stop());

          setCargando(true);
          setGrabacionTexto("Identificando marcha...");
          const blob = new Blob(chunksRef.current, { type: mimeTypeRef.current });

        };
        mr.stop();

      async function identificarConACRCloud(audioBlob) {
        try {
          const timestamp = Math.floor(Date.now() / 1000);
          const stringToSign = `POST\n/v1/identify\n${ACR_ACCESS_KEY}\naudio\n1\n${timestamp}`;
          const encoder = new TextEncoder();
          const cryptoKey = await crypto.subtle.importKey("raw", encoder.encode(ACR_ACCESS_SECRET), { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
          const signatureBuffer = await crypto.subtle.sign("HMAC", cryptoKey, encoder.encode(stringToSign));
          const signature = btoa(String.fromCharCode(...new Uint8Array(signatureBuffer)));

          const formData = new FormData();
          formData.append("sample", audioBlob, "sample.webm");
          formData.append("access_key", ACR_ACCESS_KEY);
          formData.append("data_type", "audio");
          formData.append("signature_version", "1");
          formData.append("signature", signature);
          formData.append("sample_bytes", audioBlob.size.toString());
          formData.append("timestamp", timestamp.toString());

          const res = await fetch(`https://marcheando-proxy.juanochesco.workers.dev/`, { method: "POST", body: formData });
          const data = await res.json();

          if (data.status?.code === 0 && data.metadata?.music?.length > 0) {
            const music = data.metadata.music[0];
            const titulo = music.title || "Desconocido";
            const artista = music.artists?.[0]?.name || music.composers?.[0]?.name || "Desconocido";
            const score = music.score || 100;

            // Buscar primero por título + banda (más preciso)
            let marchaLocal = MARCHAS_DB.find(m =>

              artista.toLowerCase().includes(m.banda.toLowerCase()))
            );

            // Si no encuentra por título + banda, buscar solo por título
            if (!marchaLocal) {
              marchaLocal = MARCHAS_DB.find(m =>
                m.titulo.toLowerCase().includes(titulo.toLowerCase()) ||
                titulo.toLowerCase().includes(m.titulo.toLowerCase())
              );
            }
            const spotifyUrl = music.external_metadata?.spotify?.track?.id
              ? `https://open.spotify.com/track/${music.external_metadata.spotify.track.id}`
              : null;
            const youtubeUrl = music.external_metadata?.youtube?.vid
              ? `https://www.youtube.com/watch?v=${music.external_metadata.youtube.vid}`
              : null;
            const busquedaYoutube = `https://www.youtube.com/results?search_query=${encodeURIComponent(titulo + " marcha procesional")}`;

            if (marchaLocal) {

          setResultado({ marcha: null, razonamiento: "Error al conectar con el servicio. Comprueba tu conexión." });

                )}

                {resultado && (
                  <div style={{ animation: "fadeIn 0.5s ease" }}>
                    {resultado.marcha ? (
                      <div style={{ background: "linear-gradient(135deg, #1a1008, #2a1a08)", border: "1px solid #c9a84c", borderRadius: 16, padding: "28px 32px", boxShadow: "0 0 40px rgba(201,168,76,0.1)", position: "relative", overflow: "hidden" }}>
                        <div style={{ position: "absolute", inset: 0, background: "radial-gradient(ellipse at top left, rgba(201,168,76,0.05), transparent 60%)" }} />
                        <div style={{ position: "relative" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                            <span style={{ fontSize: 11, color: "#c9a84c", letterSpacing: "0.2em", textTransform: "uppercase" }}>✓ Marcha identificada</span>
                            <span style={{ fontSize: 12, color: "#8a6a3a" }}>Confianza: {resultado.confianza}%</span>
                          </div>
                          <h2 style={{ margin: "8px 0 4px", fontFamily: "'Playfair Display', serif", fontSize: 28, color: "#f0d080" }}>{resultado.marcha.titulo}</h2>
                          <p style={{ margin: "0 0 16px", color: "#c9a84c", fontStyle: "italic" }}>{resultado.marcha.compositor} · {resultado.marcha.año}</p>
                          <p style={{ margin: "0 0 20px", fontSize: 13, color: "#8a6a3a", fontStyle: "italic", lineHeight: 1.6 }}>{resultado.razonamiento}</p>
                          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                            <button onClick={() => setMarchaSeleccionada(resultado.marcha)} style={{ background: "linear-gradient(135deg, #c9a84c, #8a6a2a)", border: "none", borderRadius: 8, padding: "10px 24px", color: "#0d0804", fontWeight: 700, cursor: "pointer", fontFamily: "'Crimson Text', serif", fontSize: 14 }}>Ver detalles</button>
                            {resultado.youtubeUrl && (
                              <a href={resultado.youtubeUrl} target="_blank" rel="noopener noreferrer" style={{ background: "#1a0804", border: "1px solid #8a1a1a", borderRadius: 8, padding: "10px 20px", color: "#ff6b6b", fontWeight: 700, cursor: "pointer", fontFamily: "'Crimson Text', serif", fontSize: 14, textDecoration: "none", display: "flex", alignItems: "center", gap: 6 }}>▶ YouTube</a>
                            )}
                            {resultado.spotifyUrl && (
                              <a href={resultado.spotifyUrl} target="_blank" rel="noopener noreferrer" style={{ background: "#0a1a0a", border: "1px solid #1a6a1a", borderRadius: 8, padding: "10px 20px", color: "#1db954", fontWeight: 700, cursor: "pointer", fontFamily: "'Crimson Text', serif", fontSize: 14, textDecoration: "none", display: "flex", alignItems: "center", gap: 6 }}>♫ Spotify</a>
                            )}
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div style={{ background: "#1a0c04", border: "1px solid #3a1510", borderRadius: 16, padding: "24px 28px", textAlign: "center" }}>
                        <p style={{ margin: 0, color: "#8a4a3a", fontStyle: "italic" }}>{resultado.razonamiento}</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* TAB CATÁLOGO */}
            {tab === "catalogo" && (
              <div style={{ animation: "fadeIn 0.4s ease" }}>
                {/* Búsqueda y filtros desplegables */}
                <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
                  <input
                    value={busqueda}
                    onChange={e => setBusqueda(e.target.value)}
                    placeholder="Buscar por título, compositor, cofradía..."
                    style={{ flex: 1, minWidth: 200, background: "#120c04", border: "1px solid #2a1808", borderRadius: 10, padding: "12px 16px", color: "#d4b060", fontSize: 14, fontFamily: "'Crimson Text', serif", outline: "none" }}
                    onFocus={e => e.target.style.borderColor = "#c9a84c"}
                    onBlur={e => e.target.style.borderColor = "#2a1808"}
                  />
                  <select value={ciudadFiltro} onChange={e => setCiudadFiltro(e.target.value)} style={{ background: "#120c04", border: "1px solid #2a1808", borderRadius: 10, padding: "12px 16px", color: "#d4b060", fontSize: 14, fontFamily: "'Crimson Text', serif", outline: "none", cursor: "pointer" }}>
                    {ciudades.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
                  <select value={compositorFiltro} onChange={e => setCompositorFiltro(e.target.value)} style={{ flex: 1, background: "#120c04", border: "1px solid #2a1808", borderRadius: 10, padding: "12px 16px", color: "#d4b060", fontSize: 14, fontFamily: "'Crimson Text', serif", outline: "none", cursor: "pointer" }}>
                    {compositores.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                {/* Botones rápidos por tipo */}
                <div style={{ marginBottom: 12 }}>
                  <p style={{ fontSize: 11, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 8 }}>Tipo de formación</p>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[{ id: "Todos", label: "Todas" }, { id: "CCT", label: "🥁 CC y TT" }, { id: "AM", label: "🎵 Agrupación Musical" }, { id: "BM", label: "🎼 Banda de Música" }].map(t => (
                      <button key={t.id} onClick={() => setTipoFiltro(t.id)} style={{
                        fontSize: 12, padding: "6px 14px", borderRadius: 20, border: "1px solid",
                        borderColor: tipoFiltro === t.id ? "#c9a84c" : "#2a1808",
                        background: tipoFiltro === t.id ? "linear-gradient(135deg, #c9a84c, #8a6a2a)" : "#120c04",
                        color: tipoFiltro === t.id ? "#0d0804" : "#8a6a3a",
                        cursor: "pointer", fontFamily: "'Crimson Text', serif",
                        fontWeight: tipoFiltro === t.id ? 700 : 400,
                        transition: "all 0.2s",
                      }}>{t.label}</button>
                    ))}
                  </div>
                </div>
                {/* Botones rápidos por banda */}
                <div style={{ marginBottom: 16 }}>
                  <p style={{ fontSize: 11, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 8 }}>Filtrar por banda</p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {bandas.map(b => (
                      <button key={b} onClick={() => setBandaFiltro(b)} style={{
                        fontSize: 11, padding: "5px 12px", borderRadius: 20, border: "1px solid",
                        borderColor: bandaFiltro === b ? "#c9a84c" : "#2a1808",
                        background: bandaFiltro === b ? "linear-gradient(135deg, #c9a84c, #8a6a2a)" : "#120c04",
                        color: bandaFiltro === b ? "#0d0804" : "#8a6a3a",
                        cursor: "pointer", fontFamily: "'Crimson Text', serif",
                        fontWeight: bandaFiltro === b ? 700 : 400,
                        transition: "all 0.2s",
                      }}>
                        {b === "Todas" ? "Todas" : b.replace("Banda de CC y TT ", "").replace("Banda de Música ", "").replace("Banda Sinfónica ", "").replace("Agrupación Musical ", "AM ")}
                      </button>
                    ))}
                  </div>
                </div>
                {/* Contador y botón limpiar */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                  <div style={{ fontSize: 12, color: "#6a4a2a", letterSpacing: "0.05em" }}>
                    {marchasFiltradas.length} marcha{marchasFiltradas.length !== 1 ? "s" : ""} encontrada{marchasFiltradas.length !== 1 ? "s" : ""}
                  </div>
                  {(bandaFiltro !== "Todas" || compositorFiltro !== "Todos" || ciudadFiltro !== "Todas" || busqueda || tipoFiltro !== "Todos") && (
                    <button onClick={() => { setBandaFiltro("Todas"); setCompositorFiltro("Todos"); setCiudadFiltro("Todas"); setBusqueda(""); setTipoFiltro("Todos"); }} style={{ fontSize: 11, color: "#c9a84c", background: "none", border: "1px solid #3a2510", borderRadius: 8, padding: "4px 12px", cursor: "pointer", fontFamily: "'Crimson Text', serif" }}>
                      ✕ Limpiar filtros
                    </button>
                  )}
                </div>
                <div style={{ display: "grid", gap: 12 }}>
                  {marchasFiltradas.map(m => <MarchaCard key={m.id} marcha={m} onSelect={setMarchaSeleccionada} />)}
                  {marchasFiltradas.length === 0 && (
                    <div style={{ textAlign: "center", padding: "48px 0", color: "#4a3020", fontStyle: "italic" }}>No se encontraron marchas con ese criterio</div>
                  )}
                </div>
              </div>
            )}
            {/* TAB BANDAS */}
            {tab === "bandas" && (
              <div style={{ animation: "fadeIn 0.4s ease" }}>
                <p style={{ color: "#8a6a3a", fontSize: 15, fontStyle: "italic", marginBottom: 24, textAlign: "center" }}>
                  Directorio de bandas procesionales de Andalucía
                </p>
                <div style={{ display: "grid", gap: 12 }}>
                  {BANDAS_DB.map(banda => (
                    <div key={banda.id} onClick={() => setBandaDetalle(banda)} className="marcha-card">
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                        <h3 style={{ margin: 0, fontFamily: "'Playfair Display', serif", fontSize: 16, color: "#f0d080", fontWeight: 700 }}>{banda.nombre}</h3>
                        {banda.fundacion > 0 && <span style={{ fontSize: 11, color: "#8a6a3a", fontFamily: "monospace", background: "#120c04", padding: "2px 8px", borderRadius: 4, whiteSpace: "nowrap" }}>{banda.fundacion}</span>}
                      </div>
                      <p style={{ margin: "0 0 10px", fontSize: 13, color: "#a08050", lineHeight: 1.5 }}>{banda.descripcion.substring(0, 100)}...</p>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 11, color: "#6a4a2a", background: "#200e04", padding: "2px 10px", borderRadius: 20, border: "1px solid #3a2510" }}>{banda.ciudad}</span>
                        {banda.web && <span style={{ fontSize: 11, color: "#6a4a2a", background: "#200e04", padding: "2px 10px", borderRadius: 20, border: "1px solid #3a2510" }}>🌐 Web</span>}
                        {banda.instagram && <span style={{ fontSize: 11, color: "#6a4a2a", background: "#200e04", padding: "2px 10px", borderRadius: 20, border: "1px solid #3a2510" }}>📷 Instagram</span>}
                        <span style={{ fontSize: 11, color: "#c9a84c", background: "#200e04", padding: "2px 10px", borderRadius: 20, border: "1px solid #3a2510" }}>
                          {MARCHAS_DB.filter(m => m.banda === banda.nombre).length} marchas
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* MODAL DETALLE BANDA */}
          {bandaDetalle && (
            <div className="overlay" onClick={() => setBandaDetalle(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 80, height: 2, background: "linear-gradient(90deg, transparent, #c9a84c, transparent)", borderRadius: 1 }} />
                <button onClick={() => setBandaDetalle(null)} style={{ position: "absolute", top: 16, right: 16, background: "none", border: "none", color: "#8a6a3a", fontSize: 22, cursor: "pointer" }}>✕</button>
                <div style={{ textAlign: "center", marginBottom: 24 }}>
                  <div style={{ fontSize: 40, marginBottom: 8 }}>🎺</div>
                  <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 20, color: "#f0d080", lineHeight: 1.3 }}>{bandaDetalle.nombre}</h2>
                  <p style={{ margin: "8px 0 0", color: "#c9a84c", fontSize: 14 }}>{bandaDetalle.ciudad}{bandaDetalle.fundacion > 0 ? ` · Desde ${bandaDetalle.fundacion}` : ""}</p>
                </div>
                <div style={{ padding: "14px 18px", background: "rgba(0,0,0,0.3)", borderRadius: 10, borderLeft: "2px solid #c9a84c", marginBottom: 20 }}>
                  <p style={{ margin: 0, fontSize: 13, color: "#a08050", lineHeight: 1.6 }}>{bandaDetalle.descripcion}</p>
                </div>
                <div style={{ marginBottom: 20 }}>
                  <p style={{ fontSize: 12, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 10 }}>En el catálogo</p>
                  <p style={{ fontSize: 14, color: "#d4b060" }}>{MARCHAS_DB.filter(m => m.banda === bandaDetalle.nombre).length} marchas registradas</p>
                </div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {bandaDetalle.web && <a href={bandaDetalle.web} target="_blank" rel="noopener noreferrer" style={{ background: "linear-gradient(135deg, #c9a84c, #8a6a2a)", border: "none", borderRadius: 8, padding: "10px 18px", color: "#0d0804", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>🌐 Web oficial</a>}
                  {bandaDetalle.instagram && <a href={bandaDetalle.instagram} target="_blank" rel="noopener noreferrer" style={{ background: "#1a0814", border: "1px solid #6a1a4a", borderRadius: 8, padding: "10px 18px", color: "#e040a0", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>📷 Instagram</a>}
                  {bandaDetalle.facebook && <a href={bandaDetalle.facebook} target="_blank" rel="noopener noreferrer" style={{ background: "#0a0a1a", border: "1px solid #1a3a8a", borderRadius: 8, padding: "10px 18px", color: "#4080e0", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>👍 Facebook</a>}
                  {bandaDetalle.twitter && <a href={bandaDetalle.twitter} target="_blank" rel="noopener noreferrer" style={{ background: "#0a0a0a", border: "1px solid #4a4a4a", borderRadius: 8, padding: "10px 18px", color: "#e0e0e0", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>𝕏 Twitter</a>}
                  <button onClick={() => { setBandaDetalle(null); setTab("catalogo"); }} style={{ background: "#1a1008", border: "1px solid #3a2510", borderRadius: 8, padding: "10px 18px", color: "#c9a84c", fontWeight: 700, cursor: "pointer", fontFamily: "'Crimson Text', serif", fontSize: 13 }}>📖 Ver sus marchas</button>
                </div>
              </div>
            </div>
          )}

          {marchaSeleccionada && <MarchaDetail marcha={marchaSeleccionada} onClose={() => setMarchaSeleccionada(null)} />}

          {/* Pie de página */}
          <div style={{ textAlign: "center", padding: "24px", borderTop: "1px solid #1e1008", marginTop: 20, marginBottom: 10 }}>
            <p style={{ margin: 0, fontSize: 11, color: "#a08050", letterSpacing: "0.1em" }}>MARCHEANDO · PASIÓN · TRADICIÓN · MÚSICA PROCESIONAL</p>
          </div>

          {/* Barra de navegación fija abajo */}
          <div style={{
            position: "fixed", bottom: 0, left: 0, right: 0,
            background: "linear-gradient(to top, #0d0604, #150e05)",
            borderTop: "1px solid #c9a84c",
            display: "flex", justifyContent: "space-around", alignItems: "center",
            padding: "10px 0 16px",
            zIndex: 50,
            boxShadow: "0 -4px 20px rgba(0,0,0,0.5)",
          }}>
            {[
              { id: "escuchar", label: "Escuchar", icon: "🎙" },
              { id: "catalogo", label: "Catálogo", icon: "📖" },
              { id: "bandas", label: "Bandas", icon: "🎺" }
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                background: tab === t.id ? "rgba(201,168,76,0.12)" : "none",
                border: "none", cursor: "pointer",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                padding: "8px 24px",
                borderRadius: 12,
                transition: "all 0.2s",
              }}>
                <span style={{ fontSize: 24 }}>{t.icon}</span>
                <span style={{
                  fontSize: 11, letterSpacing: "0.05em",
                  color: tab === t.id ? "#f0d080" : "#8a6a3a",
                  fontFamily: "'Crimson Text', serif",
                  fontWeight: tab === t.id ? 700 : 400,
                  textTransform: "uppercase",
                }}>{t.label}</span>
                {tab === t.id && <div style={{ width: 24, height: 2, background: "linear-gradient(90deg, #c9a84c, #f0d080)", borderRadius: 1 }} />}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
