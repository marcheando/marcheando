    function MarchaCard({ marcha, onSelect }) {
      const tipoColor = marcha.tipo === "BM" ? "#4a6a8a" : marcha.tipo === "AM" ? "#6a4a8a" : "#6a4a2a";
      const tipoLabel = marcha.tipo === "BM" ? "Banda de Música" : marcha.tipo === "AM" ? "Agrupación Musical" : "CC y TT";
      return (
        <div className="marcha-card" onClick={() => onSelect(marcha)}>
          <div style={{ position: "absolute", top: 0, right: 0, width: 60, height: 60, background: "radial-gradient(circle at top right, rgba(201,168,76,0.08), transparent 70%)" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
            <h3 style={{ margin: 0, fontFamily: "'Playfair Display', serif", fontSize: 17, color: "#f0d080", fontWeight: 700 }}>{marcha.titulo}</h3>
            <span style={{ fontSize: 11, color: "#8a6a3a", fontFamily: "monospace", background: "#120c04", padding: "2px 8px", borderRadius: 4 }}>{marcha.año > 0 ? marcha.año : "—"}</span>
          </div>
          <p style={{ margin: "0 0 6px", fontSize: 12, color: "#e8c870", fontStyle: "italic" }}>{marcha.compositor}</p>
          <p style={{ margin: "0 0 4px", fontSize: 12, color: "#d4a060" }}>{marcha.tipo === "BM" ? "Repertorio general" : marcha.banda}</p>
          <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11, color: tipoColor, background: "#200e04", padding: "2px 10px", borderRadius: 20, border: `1px solid ${tipoColor}` }}>{tipoLabel}</span>
            <span style={{ fontSize: 11, color: "#6a4a2a", background: "#200e04", padding: "2px 10px", borderRadius: 20, border: "1px solid #3a2510" }}>{marcha.ciudad}</span>
            {marcha.tipo !== "BM" && (
              <span style={{ 
                fontSize: 11, 
                color: marcha.propia === "propia" ? "#f0d080" : marcha.propia === "clasica" ? "#a0a0a0" : "#6a6a6a", 
                background: "#200e04", 
                padding: "2px 10px", 
                borderRadius: 20, 
                border: `1px solid ${marcha.propia === "propia" ? "#c9a84c" : "#4a4a4a"}` 
              }}>
                {marcha.propia === "propia" ? "🎼 Propia" : "🎵 Clásica"}
              </span>
            )}
          </div>
        </div>
      );
    }

              <div style={{ fontSize: 40, marginBottom: 8 }}>🎺</div>
              <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 26, color: "#f0d080" }}>{marcha.titulo}</h2>

            <div style={{ display: "grid", gap: 14 }}>

          chunksRef.current = [];
          mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };

          setEscuchando(true);

      }

      function pararGrabacion() {
        clearTimeout(timerRef.current);
        const mr = mediaRecorderRef.current;
        if (!mr || mr.state === "inactive") return;
        mr.onstop = async () => {
          streamRef.current?.getTracks().forEach(t => t.stop());
          setEscuchando(false);
          setCargando(true);
          setGrabacionTexto("Identificando marcha...");
          const blob = new Blob(chunksRef.current, { type: mimeTypeRef.current });
          await identificarConACRCloud(blob);
        };
        mr.stop();

      async function identificarConACRCloud(audioBlob) {
        try {
          console.log('🎙 Audio blob size:', audioBlob.size, 'type:', audioBlob.type);
          
          const timestamp = Math.floor(Date.now() / 1000);
          const stringToSign = `POST\n/v1/identify\n${ACR_ACCESS_KEY}\naudio\n1\n${timestamp}`;
          const encoder = new TextEncoder();
          const cryptoKey = await crypto.subtle.importKey("raw", encoder.encode(ACR_ACCESS_SECRET), { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
          const signatureBuffer = await crypto.subtle.sign("HMAC", cryptoKey, encoder.encode(stringToSign));
          const signature = btoa(String.fromCharCode(...new Uint8Array(signatureBuffer)));

          const formData = new FormData();
          formData.append("sample", audioBlob, "sample.wav");
          formData.append("access_key", ACR_ACCESS_KEY);
          formData.append("data_type", "audio");
          formData.append("signature_version", "1");
          formData.append("signature", signature);
          formData.append("sample_bytes", audioBlob.size.toString());
          formData.append("timestamp", timestamp.toString());

          console.log('📤 Enviando a proxy...', timestamp);
          const res = await fetch(`https://marcheando-proxy.juanochesco.workers.dev/`, { method: "POST", body: formData });
          console.log('📥 Respuesta status:', res.status);
          const data = await res.json();
          console.log('📊 Respuesta ACRCloud:', JSON.stringify(data));

          if (data.status?.code === 0 && data.metadata?.music?.length > 0) {
            const music = data.metadata.music[0];
            const titulo = music.title || "Desconocido";
            const artista = music.artists?.[0]?.name || music.composers?.[0]?.name || "Desconocido";
            const score = music.score || 100;

            // Buscar primero por título + banda (más preciso)
            let marchaLocal = MARCHAS_DB.find(m =>
              (m.titulo.toLowerCase().includes(titulo.toLowerCase()) ||
              titulo.toLowerCase().includes(m.titulo.toLowerCase())) &&
              (m.banda.toLowerCase().includes(artista.toLowerCase()) ||
              artista.toLowerCase().includes(m.banda.toLowerCase()))
            );

            // Si no encuentra por título + banda, buscar solo por título
            if (!marchaLocal) {
              marchaLocal = MARCHAS_DB.find(m =>
                m.titulo.toLowerCase().includes(titulo.toLowerCase()) ||
                titulo.toLowerCase().includes(m.titulo.toLowerCase())
              );
            }
            const spotifyUrl = music.external_metadata?.spotify?.track?.id
              ? `https://open.spotify.com/track/${music.external_metadata.spotify.track.id}`
              : null;
            const youtubeUrl = music.external_metadata?.youtube?.vid
              ? `https://www.youtube.com/watch?v=${music.external_metadata.youtube.vid}`
              : null;
            const busquedaYoutube = `https://www.youtube.com/results?search_query=${encodeURIComponent(titulo + " marcha procesional")}`;

            if (marchaLocal) {
              setResultado({ marcha: marchaLocal, confianza: score, razonamiento: `Identificada con ${score}% de confianza.`, spotifyUrl, youtubeUrl: youtubeUrl || busquedaYoutube });
            } else {
              setResultado({
                marcha: { id: 0, titulo, compositor: artista, banda: music.album?.name || "—", cofradia: "—", año: music.release_date?.split("-")[0] || "—", ciudad: "—", descripcion: "Marcha identificada que aún no está en nuestro catálogo." },
                confianza: score,
                razonamiento: `Identificada con ${score}% de confianza. Aún no está en el catálogo.`,
                spotifyUrl, youtubeUrl: youtubeUrl || busquedaYoutube
              });
            }
          } else if (data.status?.code === 1001) {
            setResultado({ marcha: null, razonamiento: "No se reconoció ninguna marcha. Acerca más el micrófono e inténtalo de nuevo." });
          } else {
            setResultado({ marcha: null, razonamiento: "No se pudo identificar. Inténtalo de nuevo." });
          }
        } catch {
          setResultado({ marcha: null, razonamiento: "Error al conectar con el servicio. Comprueba tu conexión." });
        }
        setCargando(false);
        setGrabacionTexto("");

                    <p style={{ fontSize: 12, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 10 }}>📅 Semana Santa</p>
                    {bandaDetalle.agenda.map((item, i) => (
                      <div key={i} style={{ display: "flex", gap: 12, padding: "8px 0", borderBottom: "1px solid #1e1008", alignItems: "flex-start" }}>
                        <span style={{ fontSize: 11, color: "#c9a84c", fontWeight: 700, minWidth: 110, paddingTop: 2 }}>{item.dia}</span>
                        <span style={{ fontSize: 13, color: "#d4b060", lineHeight: 1.4 }}>{item.acto}</span>
                      </div>
                    ))}
                  </div>
                )}
                {bandaDetalle.director && (
                  <div style={{ marginBottom: 16 }}>
                    <p style={{ fontSize: 12, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 6 }}>Directores Musicales</p>
                    <p style={{ fontSize: 14, color: "#d4b060" }}>{bandaDetalle.director}</p>
                  </div>
                )}
                {bandaDetalle.directorMusical && (
                  <div style={{ marginBottom: 16 }}>
                    <p style={{ fontSize: 12, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 6 }}>Director Musical</p>
                    <p style={{ fontSize: 14, color: "#d4b060" }}>{bandaDetalle.directorMusical}</p>
                  </div>
                )}
                {bandaDetalle.presidente && (
                  <div style={{ marginBottom: 16 }}>
                    <p style={{ fontSize: 12, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 6 }}>Presidente</p>
                    <p style={{ fontSize: 14, color: "#d4b060" }}>{bandaDetalle.presidente}</p>
                  </div>
                )}
                {bandaDetalle.email && (
                  <div style={{ marginBottom: 16 }}>
                    <p style={{ fontSize: 12, color: "#6a4a2a", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 6 }}>Contrataciones</p>
                    <p style={{ fontSize: 13, color: "#d4b060" }}>📧 {bandaDetalle.email}</p>
                    {bandaDetalle.telefono && <p style={{ fontSize: 13, color: "#d4b060", marginTop: 4 }}>📞 {bandaDetalle.telefono}</p>}
                  </div>
                )}
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {bandaDetalle.web && <a href={bandaDetalle.web} target="_blank" rel="noopener noreferrer" style={{ background: "linear-gradient(135deg, #c9a84c, #8a6a2a)", border: "none", borderRadius: 8, padding: "10px 18px", color: "#0d0804", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>🌐 Web oficial</a>}
                  {bandaDetalle.instagram && <a href={bandaDetalle.instagram} target="_blank" rel="noopener noreferrer" style={{ background: "#1a0814", border: "1px solid #6a1a4a", borderRadius: 8, padding: "10px 18px", color: "#e040a0", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>📷 Instagram</a>}
                  {bandaDetalle.facebook && <a href={bandaDetalle.facebook} target="_blank" rel="noopener noreferrer" style={{ background: "#0a0a1a", border: "1px solid #1a3a8a", borderRadius: 8, padding: "10px 18px", color: "#4080e0", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>👍 Facebook</a>}
                  {bandaDetalle.twitter && <a href={bandaDetalle.twitter} target="_blank" rel="noopener noreferrer" style={{ background: "#0a0a0a", border: "1px solid #4a4a4a", borderRadius: 8, padding: "10px 18px", color: "#e0e0e0", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>𝕏 Twitter</a>}
                  {bandaDetalle.youtube && <a href={bandaDetalle.youtube} target="_blank" rel="noopener noreferrer" style={{ background: "#1a0804", border: "1px solid #8a1a1a", borderRadius: 8, padding: "10px 18px", color: "#ff6b6b", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>▶ YouTube</a>}
                  {bandaDetalle.spotify && <a href={bandaDetalle.spotify} target="_blank" rel="noopener noreferrer" style={{ background: "#0a1a0a", border: "1px solid #1a6a1a", borderRadius: 8, padding: "10px 18px", color: "#1db954", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>♫ Spotify</a>}
                  {bandaDetalle.tiktok && <a href={bandaDetalle.tiktok} target="_blank" rel="noopener noreferrer" style={{ background: "#0a0a1a", border: "1px solid #2a2a4a", borderRadius: 8, padding: "10px 18px", color: "#69c9d0", fontWeight: 700, textDecoration: "none", fontSize: 13 }}>🎵 TikTok</a>}
                  <button onClick={() => { setBandaDetalle(null); setTab("catalogo"); }} style={{ background: "#1a1008", border: "1px solid #3a2510", borderRadius: 8, padding: "10px 18px", color: "#c9a84c", fontWeight: 700, cursor: "pointer", fontFamily: "'Crimson Text', serif", fontSize: 13 }}>📖 Ver sus marchas</button>
                </div>
              </div>
            </div>
          )}

          {marchaSeleccionada && <MarchaDetail marcha={marchaSeleccionada} onClose={() => setMarchaSeleccionada(null)} />}

          {/* Pie de página */}
          <div style={{ textAlign: "center", padding: "24px", borderTop: "1px solid #1e1008", marginTop: 20, marginBottom: 10 }}>
            <p style={{ margin: 0, fontSize: 11, color: "#a08050", letterSpacing: "0.1em" }}>MARCHEANDO · PASIÓN · TRADICIÓN · MÚSICA PROCESIONAL</p>
          </div>

          {/* Barra de navegación fija abajo */}
          <div style={{
            position: "fixed", bottom: 0, left: 0, right: 0,
            background: "linear-gradient(to top, #0d0604, #150e05)",
            borderTop: "1px solid #c9a84c",
            display: "flex", justifyContent: "space-around", alignItems: "center",
            padding: "10px 0 16px",
            zIndex: 50,
            boxShadow: "0 -4px 20px rgba(0,0,0,0.5)",
          }}>
            {[
              { id: "escuchar", label: "Escuchar", icon: "🎙" },
              { id: "catalogo", label: "Catálogo", icon: "📖" },
              { id: "bandas", label: "Bandas", icon: "🎺" },
              { id: "hermandades", label: "Cofradías", icon: "⛪" }
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                background: tab === t.id ? "rgba(201,168,76,0.12)" : "none",
                border: "none", cursor: "pointer",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                padding: "8px 24px",
                borderRadius: 12,
                transition: "all 0.2s",
              }}>
                <span style={{ fontSize: 24 }}>{t.icon}</span>
                <span style={{
                  fontSize: 11, letterSpacing: "0.05em",
                  color: tab === t.id ? "#f0d080" : "#8a6a3a",
                  fontFamily: "'Crimson Text', serif",
                  fontWeight: tab === t.id ? 700 : 400,
                  textTransform: "uppercase",
                }}>{t.label}</span>
                {tab === t.id && <div style={{ width: 24, height: 2, background: "linear-gradient(90deg, #c9a84c, #f0d080)", borderRadius: 1 }} />}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
